name: Generate Skyline

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (free for public repos)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/generate-skyline.mjs", "scripts/generate-assets.mjs", "scripts/update-readme.mjs", ".github/workflows/skyline.yml"]

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Keep previous images as fallback
        run: |
          mkdir -p dist
          # git archive extracts the files without touching git's index (checkout would stage them)
          git fetch --depth=1 origin output && git archive FETCH_HEAD | tar -x -C dist || true

      - name: Build skyline from contribution data
        run: node scripts/generate-skyline.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT: dist/skyline.svg

      - name: Build live terminal header (latest pushed repo)
        run: node scripts/generate-assets.mjs --live --out dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Update the skyline links in the README (only commits when something changed)
        run: |
          node scripts/update-readme.mjs dist/skyline/weeks.json
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update skyline week links"
            git push origin HEAD:main || echo "README push skipped (main moved on); the next run will retry"
          fi
        env:
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
